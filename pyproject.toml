[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lego-builder"
version = "0.1.0"
description = "Deterministic local mesh-to-LEGO research converter"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "trimesh==5.1.0", "rtree==1.4.1", "Pillow==12.3.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
lego-builder = "lego_builder.cli:main"

[tool.setuptools.packages.find]
include = ["lego_builder*"]

[tool.setuptools.package-data]
lego_builder = ["data/*.json", "data/ldraw/*.dat", "data/ldraw/parts/*.dat", "data/ldraw/*.txt", "data/ldraw/*.ldr", "data/*.md", "data/parts-library/*.json", "data/parts-library/*.txt", "data/parts-library/*.ldr", "data/parts-library/parts/*.dat", "data/parts-library/parts/s/*.dat", "data/parts-library/p/*.dat", "data/parts-library/p/48/*.dat", "data/parts-library/p/8/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
